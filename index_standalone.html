      // ─── AI YORDAMCHI FUNKSIYALAR ───────────────────────────
      // Matndan raqam ajratib olish: "2 million", "500 ming", "3 mln", "1500000"
      const extractBudget = (text) => {
        const lq = text.toLowerCase().replace(/\s/g,'');
        // "X million" / "X mln"
        let m = lq.match(/(\d+[\.,]?\d*)\s*mln|million|milyon/);
        if (m) return parseFloat(m[1].replace(',','.')) * 1000000;
        // "X ming" / "K"
        m = lq.match(/(\d+[\.,]?\d*)\s*ming|k(?!\w)/);
        if (m) return parseFloat(m[1].replace(',','.')) * 1000;
        // to'g'ridan-to'g'ri raqam (5 xonali+)
        m = text.match(/\b(\d{4,})\b/);
        if (m) return parseInt(m[1]);
        // oddiy raqam "2" (million deb olamiz agar kichik bo'lsa)
        m = text.match(/\b(\d{1,3})\b/);
        if (m) {
          const n = parseInt(m[1]);
          return n <= 100 ? n * 1000000 : n * 1000; // "2" → 2 mln, "500" → 500 000
        }
        return null;
      };

      const handleAiSend = (overrideText) => {

        setAiTyping(true);

        setTimeout(() => {
          const lq = q.toLowerCase();
          let reply;

          // ── 1. BUDGET KUTILAYOTGAN HOLAT ────────────────────
          if (aiWaitingBudget) {
            const budget = extractBudget(q);

              setAiBudget(budget);
              setAiWaitingBudget(false);
              const cats = aiPendingCats;
              setAiPendingCats([]);
              let found = ALL_PRODUCTS.filter(p => {
                const inCat = cats.length === 0 || cats.includes(p.cat);
                return inCat && p.price <= budget;
              }).sort((a,b) => b.price - a.price);
              if (found.length === 0) {
                found = ALL_PRODUCTS.filter(p => cats.length === 0 || cats.includes(p.cat)).sort((a,b) => a.price - b.price).slice(0,4);
                reply = { sender:'ai', text:`😕 ${formatPrice(budget)} budgetda ${cats.length>0?'bu kategoriyada':''} mahsulot topilmadi.\n\nEng arzon variantlar ko'rsatildi 👇`, products: found, budgetNote: `Budget: ${formatPrice(budget)}` };
              } else {
                reply = { sender:'ai', text:`✅ ${formatPrice(budget)} budgetda ${found.length} ta mahsulot topildi! 🎉\n\nSizga mos variantlar 👇`, products: found, budgetNote: `Budget: ${formatPrice(budget)}` };
              }
            } else {
              reply = { sender:'ai', text:`Budgetni tushunmadim 😅\n\nQuyidagicha yozing:\n• "2 million"\n• "1 500 000"\n• "500 ming"\n• "3 mln"` };
            }
            setAiTyping(false);
            setAiMessages(prev => [...prev, reply]);
            setTimeout(() => { if(aiChatRef.current) aiChatRef.current.scrollTop = aiChatRef.current.scrollHeight; }, 50);
            return;
          }

          // ── 2. BUDGET + KATEGORIYA BITTA XABARDA ────────────
          // "1 million ga telefon", "500 ming gacha noutbuk"
          const inlineBudget = extractBudget(q);
          if (inlineBudget) {
            let matchedCats = [];
            for (const [kw, cats] of Object.entries(CAT_KEYWORDS)) {
              if (lq.includes(kw) && cats.length > 0) { matchedCats = [...new Set([...matchedCats, ...cats])]; }
            }
            let found = ALL_PRODUCTS.filter(p => {
              const inCat = matchedCats.length === 0 || matchedCats.includes(p.cat);
              return inCat && p.price <= inlineBudget;
            }).sort((a,b) => b.price - a.price);
            if (found.length === 0) {
              found = ALL_PRODUCTS.filter(p => matchedCats.length === 0 || matchedCats.includes(p.cat)).sort((a,b) => a.price - b.price).slice(0,4);
              reply = { sender:'ai', text:`😕 ${formatPrice(inlineBudget)} da mos mahsulot topilmadi.\nEng arzon variantlar 👇`, products: found, budgetNote:`Budget: ${formatPrice(inlineBudget)}` };
            } else {
              const catLabel = matchedCats.length>0 ? CATEGORIES.filter(c=>matchedCats.includes(c.id)).map(c=>c.label).join(', ') : 'barcha';
              reply = { sender:'ai', text:`💰 ${formatPrice(inlineBudget)} budgetda ${catLabel} mahsulotlari — ${found.length} ta topildi! 🎉`, products: found, budgetNote:`Budget: ${formatPrice(inlineBudget)}` };
            }
            setAiBudget(inlineBudget);
            setAiTyping(false);
            setAiMessages(prev => [...prev, reply]);
            setTimeout(() => { if(aiChatRef.current) aiChatRef.current.scrollTop = aiChatRef.current.scrollHeight; }, 50);
            return;
          }

                                          text: filtered3.length>0
                                            ? `✅ ${formatPrice(b.max)} budgetda ${filtered3.length} ta mahsulot:`
                                            : `😕 ${formatPrice(b.max)} budgetda topilmadi. Budgetni ko'paytiring.`,
                                          products: filtered3,
                                          budgetNote: `Budget: ${formatPrice(b.max)}`
                                        };
                                        setAiMessages(prev => [...prev, reply3]);
                                        setTimeout(() => { if(aiChatRef.current) aiChatRef.current.scrollTop = aiChatRef.current.scrollHeight; }, 50);
                                      }}
                                      className="px-3 py-1.5 rounded-xl bg-white dark:bg-gray-800 border border-violet-300 dark:border-violet-700 text-violet-700 dark:text-violet-300 text-[11px] font-bold hover:bg-violet-100 dark:hover:bg-violet-900 transition-colors"
                                    >{b.label}</button>
                                  ))}
                                </div>
                              </div>
                            )}
                          </div>
                        )}

                        {/* Budget kutilmoqda */}
                        {msg.sender==='ai' && aiWaitingBudget && i === aiMessages.length-1 && (
                          <div className="mt-2 p-3 bg-amber-50 dark:bg-amber-950/40 rounded-2xl border border-amber-200 dark:border-amber-800">
                            <div className="text-[11px] text-amber-700 dark:text-amber-300 font-bold mb-2">💰 Tez tanlang yoki o'zingiz yozing:</div>
                            <div className="flex flex-wrap gap-1.5">
                              {[
                                { label:'500 000 so\'m', val:'500000' },
                                { label:'1 million', val:'1 million' },
                                { label:'2 million', val:'2 million' },
                                { label:'5 million', val:'5 million' },
                                { label:'10 million', val:'10 million' },
                              ].map(b => (
                                <button key={b.val} onClick={() => handleAiSend(b.val)} className="px-3 py-1.5 rounded-xl bg-white dark:bg-gray-800 border border-amber-300 dark:border-amber-700 text-amber-700 dark:text-amber-300 text-[11px] font-bold hover:bg-amber-100 transition-colors">{b.label}</button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                      {msg.sender==='user' && (
                        <div className="w-9 h-9 rounded-xl bg-gray-200 dark:bg-gray-700 flex items-center justify-center text-base flex-shrink-0 mt-0.5">👤</div>
                      )}
                    </div>
                  ))}

                  {/* Typing indicator */}
                  {aiTyping && (
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center text-base shadow">🤖</div>
                      <div className="bg-gray-100 dark:bg-gray-800 rounded-2xl rounded-bl-sm px-5 py-3.5 flex items-center gap-2">
                        {[0,160,320].map(d => (
                          <span key={d} className="w-2.5 h-2.5 rounded-full bg-violet-500 animate-bounce" style={{animationDelay:d+'ms'}}></span>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Input */}
                <div className="p-4 border-t border-gray-100 dark:border-gray-800 flex-shrink-0">
                  <div className="flex gap-2">
                    <input
                      ref={aiInputRef}
                      type="text"
                      value={aiQuery}
                      onChange={e => setAiQuery(e.target.value)}
                      onKeyDown={e => e.key==='Enter' && handleAiSend()}
                      placeholder={aiWaitingBudget ? "Budgetni yozing: 2 million, 500 ming..." : "Mahsulot nomi yoki so'rovingizni yozing..."}
                      className={`flex-1 px-4 py-3 rounded-2xl text-sm focus:outline-none focus:ring-2 border ${
                        aiWaitingBudget
                          ? 'bg-amber-50 dark:bg-amber-950/30 border-amber-300 dark:border-amber-700 text-amber-900 dark:text-amber-100 placeholder-amber-500 focus:ring-amber-400'
                          : 'bg-gray-100 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:ring-violet-500'
                      }`}
                    />
                    <button
                      onClick={() => handleAiSend()}
                      disabled={!aiQuery.trim() || aiTyping}
                      className="px-5 py-3 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-black text-sm disabled:opacity-40 disabled:cursor-not-allowed hover:from-violet-700 hover:to-indigo-700 transition-all shadow-md hover:scale-105 active:scale-95"
                    >➤</button>
                  </div>
                  {aiWaitingBudget && (
                    <p className="text-[10px] text-amber-500 font-semibold mt-1.5 px-1">💡 Budgetingizni yozing yoki yuqoridagi tugmalardan tanlang</p>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* TOAST */}
          {toast && (
            <div className={`fixed bottom-24 right-5 sm:bottom-6 px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl border animate-bounce z-50 ${toastType==='success'?'bg-gray-900 text-white border-gray-700':'bg-rose-600 text-white border-rose-500'}`}>
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
